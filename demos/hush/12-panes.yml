feature: panes
state: sidebar open on the chapter project; one section open in the editor
description:
  - drag a section of the chapter out of the sidebar; it opens as a pane
  - dock that pane to the right
  - drag the research notebook out of the sidebar as a second pane and dock it to the bottom
  - drag a note from the notebook into the section being written

# Script (written from the spec above; edit freely) ------------------------
content: [pequod/*]
setup:
  - press: Meta+Backslash
  - click: "text=\"The engine\""
  - waitFor: ".cm-line:has-text(\"nobody is free\")"
  - click: ".cm-line:has-text(\"nobody is free\")"
steps:
  - drag: { from: "text=\"Starbuck's bind\"", to: [760, 300], keys: Meta, duration: 1200 }
    note: drag a section out of the sidebar; it opens as a pane
  - wait: 1000
  - drag: { from: .floating-pane-titlebar, to: [1262, 400], duration: 1100 }
    note: dock it to the right
  - wait: 1000
  - drag: { from: "text=\"The Pequod's crew\"", to: [640, 420], keys: Meta, duration: 1200 }
    note: drag the research notebook out as a second pane
  - wait: 1000
  - drag: { from: ".floating-pane:not(.docked) .floating-pane-titlebar", to: [640, 792], duration: 1100 }
    note: dock it to the bottom
  - wait: 900
  - scroll: { at: ".floating-pane.docked-bottom", by: [0, 140], duration: 800 }
  - wait: 600
  - drag: { from: ".hush-card-nb:has-text(\"doubloon\") .hush-card-header", to: ".cm-line:has-text(\"nobody is free\")", duration: 1300 }
    note: drag a note from the notebook into the section
  - wait: 2000
