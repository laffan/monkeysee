feature: focus-modes
state: the "Ishmael outside" section open from the chapter project, caret at the end, sidebar open
description:
  - turn on Focus Mode; only the current sentence stays lit
  - keep writing; the lit sentence follows the caret, then turn it off
  - enter Zen Focus; the line being written sits in the middle of the screen
  - write a word, then leave Zen Focus

# Script (written from the spec above; edit freely) ------------------------
content: [pequod/*]
setup:
  - press: Meta+Backslash
  - click: "text=\"Ishmael outside\""
  - waitFor: ".cm-line:has-text(\"Ishmael is the exception\")"
  - click: ".cm-line:has-text(\"Ishmael is the exception\")"
  - press: Meta+End
  - press: Backspace
steps:
  - press: Meta+S
    note: turn on Focus Mode
  - wait: 1500
  - type: " He signs on."
    note: keep writing; the lit sentence follows the caret
  - wait: 1200
  - press: Meta+S
    note: turn Focus Mode off
  - wait: 1000
  - press: Meta+Shift+S
    note: enter Zen Focus
  - wait: 1800
  - type: " Why?"
    note: write a word
  - wait: 1500
  - press: Meta+Shift+S
    note: leave Zen Focus
  - wait: 1200
