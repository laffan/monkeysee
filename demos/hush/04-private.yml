feature: private
state: the "Ishmael outside" section open from the chapter project, caret at the end, sidebar open
description:
  - turn on Private Mode; every word on screen is blacked out
  - keep writing; new words are hidden too
  - turn it off; the text is all still there

# Script (written from the spec above; edit freely) ------------------------
content: [pequod/*]
setup:
  - press: Meta+Backslash
  - click: "text=\"Ishmael outside\""
  - waitFor: ".cm-line:has-text(\"Ishmael is the exception\")"
  - click: ".cm-line:has-text(\"Ishmael is the exception\")"
  - press: Meta+End
  - press: Backspace
steps:
  - press: Meta+Shift+P
    note: turn on Private Mode
  - wait: 1500
  - type: " He signs on for the money. He stays for the telling."
    note: keep writing
  - wait: 1000
  - press: Meta+Shift+P
    note: turn it off
  - wait: 1800
