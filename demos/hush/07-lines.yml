feature: lines
state: the whaling glossary open, caret on its last entry, sidebar open
description:
  - move the last entry to the top with the keyboard, so the list is in alphabetical order
  - select a word and make it bold, then highlight it

# Script (written from the spec above; edit freely) ------------------------
content: [pequod/*]
setup:
  - press: Meta+Backslash
  - click: "text=\"Whaling glossary\""
  - waitFor: ".cm-line:has-text(\"Doubloon\")"
  - click: ".cm-line:has-text(\"the gold coin\")"
steps:
  - press: Alt+ArrowUp
    note: move the entry up
  - wait: 600
  - press: Alt+ArrowUp
  - wait: 600
  - press: Alt+ArrowUp
  - wait: 600
  - press: Alt+ArrowUp
  - wait: 1200
  - click: { selector: ".cm-line:has-text(\"brick furnace\")", double: true }
    note: make a word bold
  - wait: 600
  - press: Meta+B
  - wait: 1200
  - press: Meta+=
    note: highlight it
  - wait: 1500
