feature: courier
state: the essay open, a thought arrives about a different document
description:
  - tap Shift three times to open Courier from anywhere
  - choose Append and pick the reading log
  - write the note and send it without leaving the essay
  - open the reading log; the note is at the end

# Script (written from the spec above; edit freely) ------------------------
content: [pequod/*]
setup:
  - press: Meta+Backslash
  - click: "text=The Crew as a Machine"
  - press: Meta+Backslash
  - waitFor: ".cm-line:has-text(\"Melville builds\")"
  - click: ".cm-line:has-text(\"Ishmael is the exception\")"
steps:
  - press: { keys: Shift, times: 3 }
    note: tap Shift three times to open Courier from anywhere
  - wait: 1400
  - click: ".courier-mode:text-is(\"Append\")"
    note: choose Append and pick the reading log
  - wait: 800
  - click: ".courier-row:has-text(\"Reading log\")"
  - wait: 1200
  - type: "Seminar question: is Ahab mad, or only certain?"
    note: write the note and send it without leaving the essay
  - wait: 700
  - press: Meta+Enter
  - wait: 1400
  - press: Meta+Backslash
    note: open the reading log; the note is at the end
  - wait: 700
  - click: "text=Reading log"
  - wait: 700
  - press: Meta+Backslash
  - wait: 2000
