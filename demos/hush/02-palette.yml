feature: palette
state: the "Ishmael outside" section open from the chapter project, sidebar open
description:
  - open the command palette and scroll through what is in it
  - search for a style and switch to it
  - search again and turn on Midnight mode

# Script (written from the spec above; edit freely) ------------------------
content: [pequod/*]
setup:
  - press: Meta+Backslash
  - click: "text=\"Ishmael outside\""
  - waitFor: ".cm-line:has-text(\"Ishmael is the exception\")"
  - click: ".cm-line:has-text(\"Ishmael is the exception\")"
  - press: Meta+End
  - press: Backspace
steps:
  - press: Meta+P
    note: open the command palette
  - wait: 900
  - scroll: { at: .cmd-palette-list, by: 500, duration: 1400 }
  - wait: 600
  - type: serif
    note: switch to a style
  - wait: 700
  - press: Enter
  - wait: 2000
  - press: Meta+P
    note: turn on Midnight mode
  - wait: 600
  - type: midnight mode
  - wait: 700
  - press: Enter
  - wait: 2200
