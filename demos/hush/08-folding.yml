feature: folding
state: the reading log open, a document with four sections, sidebar open
description:
  - fold every section from the command palette
  - open the title; the sections underneath stay folded, like an outline
  - open one section again

# Script (written from the spec above; edit freely) ------------------------
content: [pequod/*]
setup:
  - press: Meta+Backslash
  - click: "text=\"Reading log\""
  - waitFor: ".cm-line:has-text(\"Spouter-Inn\")"
  - click: ".cm-line:has-text(\"Spouter-Inn\")"
steps:
  - press: Meta+P
    note: fold every section
  - wait: 500
  - type: fold all
  - wait: 600
  - press: Enter
  - wait: 2000
  - click: ".hush-fold-pill >> nth=0"
    note: open the title; the sections underneath stay folded, like an outline
  - wait: 1500
  - click: ".hush-fold-pill >> nth=2"
    note: open one section again
  - wait: 1800
