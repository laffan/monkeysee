feature: markdown
state: the essay open, sidebar closed
description:
  - start a new section at the end of the essay
  - write a paragraph with bold, highlight and a link to another note
  - start a new line: the formatting stays rendered and the marks stay faint

# Script (written from the spec above; edit freely) ------------------------
content: [pequod/*]
typing: { wpm: 110 }
setup:
  - press: Meta+Backslash
  - click: "text=The Crew as a Machine"
  - press: Meta+Backslash
  - waitFor: ".cm-line:has-text(\"Ishmael is the exception\")"
  - click: ".cm-line:has-text(\"Ishmael is the exception\")"
  - press: Meta+End
  - press: Backspace
steps:
  - type: "\n\n## The doubloon\n\n"
    note: start a new section at the end of the essay
  - wait: 500
  - type: "Ahab nails a **gold doubloon** to the mast, and ==every man aboard== reads it differently. See [[Starbuck]]."
    note: write a paragraph with bold, highlight and a link to another note
  - wait: 600
  - press: Enter
    note: start a new line
  - wait: 2200
