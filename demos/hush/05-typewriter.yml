feature: typewriter
state: the first chapter of Moby-Dick open, sidebar open, caret at the end
description:
  - turn on typewriter scrolling; the page scrolls so the caret line stays at mid-screen
  - write a few lines
  - turn it off again

# Script (written from the spec above; edit freely) ------------------------
content: [pequod/*]
setup:
  - press: Meta+Backslash
  - click: "text=\"Loomings\""
  - waitFor: ".cm-line:has-text(\"Circumambulate\")"
  - click: ".cm-line:has-text(\"Circumambulate\")"
  - press: Meta+End
  - press: Backspace
steps:
  - press: Meta+Shift+T
    note: turn on typewriter scrolling
  - wait: 1500
  - type: "\n\nThere is magic in it. Let the most absent-minded of men be plunged in his deepest reveries, and he will infallibly lead you to water."
    note: write a few lines
  - wait: 1200
  - press: Meta+Shift+T
    note: turn it off
  - wait: 1200
