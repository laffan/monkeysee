feature: writing-shortcuts
state: the "The engine" section open from the chapter project, caret at the start of the first paragraph, sidebar open
description:
  - jump through the paragraph a sentence at a time, then back
  - select the first sentence and move it forward through the paragraph, then back
  - in the whaling glossary, move the last entry up to the top with Option-Up
  - in the reading log, select a name with Command-D and jump to its next use
  - fold every section, then open the title and one section again

# Script (written from the spec above; edit freely) ------------------------
content: [pequod/*]
setup:
  - press: Meta+Backslash
  - click: "text=\"The engine\""
  - waitFor: ".cm-line:has-text(\"Melville builds\")"
  - click: ".cm-line:has-text(\"Melville builds\")"
  - press: { keys: Meta+ArrowLeft, times: 2 }
steps:
  # Sentences: jump, select, move forward and back
  - press: Meta+ArrowRight
    note: jump forward a sentence at a time
  - wait: 600
  - press: Meta+ArrowRight
  - wait: 600
  - press: Meta+ArrowLeft
  - wait: 500
  - press: Meta+ArrowLeft
  - wait: 800
  - press: Meta+L
    note: select the sentence
  - wait: 1000
  - press: Alt+Meta+ArrowRight
    note: move it forward through the paragraph
  - wait: 1200
  - press: Alt+Meta+ArrowRight
  - wait: 1400
  - press: Alt+Meta+ArrowLeft
    note: and back
  - wait: 1000
  - press: Alt+Meta+ArrowLeft
  - wait: 1400
  # Lines: move the last glossary entry to the top
  - click: "#panel-overlay >> text=\"Whaling glossary\""
  - waitFor: ".cm-line:has-text(\"Doubloon\")"
  - click: ".cm-line:has-text(\"the gold coin\")"
  - press: Alt+ArrowUp
    note: move the entry up
  - wait: 450
  - press: Alt+ArrowUp
  - wait: 450
  - press: Alt+ArrowUp
  - wait: 450
  - press: Alt+ArrowUp
  - wait: 1300
  # Words: select a name and jump to its next use
  - click: "#panel-overlay >> text=\"Reading log\""
  - waitFor: ".cm-line:has-text(\"Spouter-Inn\")"
  - click: ".cm-line:has-text(\"Spouter-Inn\")"
  - press: { keys: Meta+ArrowLeft, silent: true }
  - wait: 500
  - press: Meta+D
    note: select the word
  - wait: 1300
  - press: Meta+D
    note: jump to its next use
  - wait: 1500
  # Folding
  - press: Meta+P
    note: fold every section
  - wait: 450
  - type: fold all
  - wait: 500
  - press: Enter
  - wait: 1800
  - click: ".hush-fold-pill >> nth=0"
    note: open the title; the sections underneath stay folded
  - wait: 1400
  - click: ".hush-fold-pill >> nth=2"
    note: open one section again
  - wait: 1800
