    note: tap Shift three times to open Courier from anywhere
  - wait: 1400
  - click: ".courier-mode:text-is(\"Append\")"
    note: choose Append and pick the reading log
  - wait: 800
  - click: ".courier-row:has-text(\"Reading log\")"
  - wait: 1200
  - type: "Seminar question: is Ahab mad, or only certain?"
    note: write the note and send it without leaving the essay
  - wait: 700
  - press: Meta+Enter
  - wait: 1400
  - click: "text=\"Reading log\""
    note: open the reading log; the note is at the end
  - wait: 2000
