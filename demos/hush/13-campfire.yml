feature: campfire
state: the essay open, caret at the end
description:
  - tap Command three times; only the words near the caret stay lit
  - keep writing; the light follows the caret
  - tap Command three times again to put it out

# Script (written from the spec above; edit freely) ------------------------
content: [pequod/*]
setup:
  - press: Meta+Backslash
  - click: "text=The Crew as a Machine"
  - press: Meta+Backslash
  - waitFor: ".cm-line:has-text(\"Melville builds\")"
  - click: ".cm-line:has-text(\"Ishmael is the exception\")"
  - press: Meta+End
  - press: Backspace
steps:
  - press: { keys: Meta, times: 3 }
    note: tap Command three times; only the words near the caret stay lit
  - wait: 1800
  - type: "\n\nThat distance is the book's way out. The machine needs every hand, and it cannot quite hold the one who is telling the story."
    note: keep writing; the light follows the caret
  - wait: 1500
  - press: { keys: Meta, times: 3 }
    note: tap Command three times again to put it out
  - wait: 1800
