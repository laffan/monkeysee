feature: cards
state: the "Starbuck's bind" section open from the chapter project, caret in the second paragraph, sidebar open
description:
  - select a sentence and turn it into a card; it moves to the margin
  - keep writing above it; the card moves down with its line

# Script (written from the spec above; edit freely) ------------------------
content: [pequod/*]
setup:
  - press: Meta+Backslash
  - click: "text=\"Starbuck's bind\""
  - waitFor: ".cm-line:has-text(\"Starbuck sees the danger\")"
  - click: ".cm-line:has-text(\"Starbuck sees the danger\")"
steps:
  - press: Meta+L
    note: select a sentence
  - wait: 900
  - press: Meta+Shift+Comma
    note: turn it into a card
  - wait: 2000
  - click: [960, 154]
    note: keep writing above it; the card moves down with its line
  - wait: 500
  - type: " Even the cook has a station, and the cabin boy keeps the time."
  - wait: 1800
