feature: shuffle
state: the "The engine" section open from the chapter project, caret in the first paragraph, sidebar open
description:
  - select the paragraph and open it in the Shuffle Editor; each sentence becomes a card
  - drag a sentence to a new place
  - close the editor, compare with the original and keep the new order

# Script (written from the spec above; edit freely) ------------------------
content: [pequod/*]
setup:
  - press: Meta+Backslash
  - click: "text=\"The engine\""
  - waitFor: ".cm-line:has-text(\"Melville builds\")"
  - click: ".cm-line:has-text(\"Melville builds\")"
  - press: { keys: Meta+ArrowLeft, times: 2 }
steps:
  - press: Meta+Shift+ArrowDown
    note: select the paragraph
  - wait: 900
  - press: Meta+Shift+E
    note: open the Shuffle Editor
  - wait: 2500
  - drag:
      from: ".shuffle-node.in-editor >> nth=0"
      to: ".shuffle-node.in-editor >> nth=2"
      duration: 1400
    note: drag a sentence to a new place
  - wait: 1500
  - click: .shuffle-editor-done
    note: close the editor, compare with the original and keep the new order
  - wait: 1800
  - click: .shuffle-compare-keep-shuffled
  - wait: 1600
