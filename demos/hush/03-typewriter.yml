feature: typewriter
state: the crew notebook (a flowchart) open, with the first chapter of Moby-Dick already dragged out of the sidebar into a pane, caret at the end of its text
description:
  - ⌘-double-click the pane's title bar to stretch it to full height
  - turn on typewriter scrolling and start typing
  - after a few words, drag the typewriter line down to about two thirds of the pane
  - keep typing

