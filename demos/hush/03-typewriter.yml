  - drag: { from: "#panel-overlay >> text=\"Loomings\"", to: [1045, 330], keys: Meta, duration: 300 }
  - wait: 1000
  - click: ".floating-pane .cm-content"
  - press: Meta+End
  - wait: 1600
steps:
  - wait: 700
  - click: { at: [1080, 330], double: true, keys: Meta }
    note: stretch the pane to full height
  - wait: 1200
  - press: Meta+Shift+T
    note: turn on typewriter scrolling
  - wait: 1200
  - type: "\n\nThere is magic in it. Let the most absent-minded of men"
    note: start typing
  - wait: 700
  - drag: { from: ".pane-tw-line", to: [1045, 517], duration: 900 }
    note: drag the typewriter line down to two thirds
  - wait: 900
  - type: " be plunged in his deepest reveries, and he will infallibly lead you to water. Should you ever be athirst in the great American desert, try this experiment."
