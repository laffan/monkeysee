feature: panes
state: left sidebar open, ten demo text and notebook files
description:
  - working on text document
  - open notebook with flowchart and notes as a pane
  - dock pane to right
  - drag a note from notebook into document

# Script (written from the spec above; edit freely) ------------------------
content: [pequod/*]
typing: { wpm: 120 }
setup:
  - press: { keys: Meta+Backslash, note: open the sidebar }
  - click: "text=The Crew as a Machine"
  - waitFor: ".cm-line:has-text(\"Ishmael is the exception\")"
  - click: ".cm-line:has-text(\"Ishmael is the exception\")"
  - press: Meta+End
  - press: Backspace
steps:
  - type: " He is also the only one left to tell it."
    note: working on text document
  - wait: 800
  - press: Meta+Shift+O
    note: open notebook as a pane
  - wait: 400
  - type: pequod
  - wait: 400
  - press: Enter
  - wait: 1500
  - drag: { from: .floating-pane-titlebar, to: [1255, 400], duration: 1100 }
    note: dock pane to right
  - wait: 1400
  - drag: { from: ".hush-card-nb:has-text(\"doubloon\") .hush-card-header", to: ".cm-line:has-text(\"nobody is free\")", duration: 1200 }
    note: drag a note from notebook into document
  - wait: 1800
