# Hush, with the first chapter of Moby-Dick: typing, Focus Mode, word count,
# and Zen Focus from the command palette.
app: hush
title: Writing in Hush
output: [out/hush-moby-dick.mp4, out/hush-moby-dick.gif]
content:
  - moby-dick/chapter-1
scale: 2
typing: { wpm: 95 }
steps:
  - card: { title: Hush, subtitle: A quiet place to write, duration: 1800 }
  - click: ".cm-line:has-text(\"Circumambulate\")"
  - press: { keys: Meta+End, silent: true, note: caret to the end of Loomings }
  - type: "\n\nWhenever it is a damp, drizzly November in my soul, I write."
  - wait: 700
  - press: { keys: Meta+S, label: Focus Mode }
  - wait: 2200
  - press: { keys: Meta+S, label: Focus Mode off }
  - wait: 500
  - press: { keys: Meta+Shift+W, label: Word count }
  - wait: 1600
  - press: { keys: Meta+P, label: Command palette }
  - wait: 400
  - type: zen
  - wait: 500
  - press: Enter
  - caption: Zen Focus keeps the line you're on in the middle of the screen
  - wait: 2800
  - caption: null
  - press: { keys: Meta+Shift+S, label: Exit Zen Focus }
  - wait: 800
