feature: no-images-no-color
state: the tide pool field guide open in full colour, sidebar showing
description:
  - turn off colour; the page goes black and white
  - turn off images; pictures become quiet gray boxes
  - point at one; it shows itself while the pointer is there
  - Command-I brings the pictures back

content: [shoreline/*]
appOptions:
  tabs:
    - https://tidepoolguide.net/rocky-shore
    - https://whaleatlas.org/species/humpback
    - https://harborgazette.com/coast/logbooks-online
  active: 0
steps:
  - wait: 1200
  - click: "#color"
    note: black and white pages
  - wait: 1600
  - click: "#images"
    note: hide images and video
  - wait: 1600
  - move: "page: .card img >> nth=1"
    note: hover reveals one picture
  - wait: 1600
  - move: "page: h1"
  - wait: 900
  - click: "#tabs .tab:has-text(\"humpback\")"
    note: the modes follow you to every page
  - wait: 1600
  - move: [1180, 120]
  - press: Meta+I
    note: pictures back
  - wait: 1200
  - click: "#color"
  - wait: 1400
