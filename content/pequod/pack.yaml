  quarter-deck:
    title: The quarter-deck
    file: chapter/quarter-deck.md
    in: The Crew as a Machine
  starbuck:
    title: Starbuck's bind
    file: chapter/starbuck.md
    in: The Crew as a Machine
  harpooneers:
    title: The harpooneers
    file: chapter/harpooneers.md
    in: The Crew as a Machine
  ishmael:
    title: Ishmael outside
    file: chapter/ishmael.md
    in: The Crew as a Machine
  crew-notebook:
