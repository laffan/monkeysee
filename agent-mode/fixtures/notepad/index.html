<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notepad</title>
<style>
  :root { --bg: #fbfaf7; --fg: #1d1c1a; --muted: #8a877f; --accent: #5b6cf0; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
    font: 16px/1.6 Georgia, "Times New Roman", serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 28px; color: var(--muted);
    font: 13px -apple-system, system-ui, sans-serif; transition: opacity .3s; }
  header b { color: var(--fg); }
  #wc { margin-left: auto; display: none; }
  body.wc #wc { display: inline; }
  body.focus header { opacity: .15; }
  #editor { flex: 1; width: min(720px, 90vw); margin: 0 auto; padding: 24px 0 120px; border: 0; outline: 0; resize: none;
    background: transparent; color: inherit; font: inherit; font-size: 19px; line-height: 1.7; }
  #palette { position: fixed; inset: 0; display: none; align-items: flex-start; justify-content: center; padding-top: 18vh; background: rgba(0,0,0,.18); }
  #palette.open { display: flex; }
  #palette .box { width: 460px; background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.25); overflow: hidden;
    font: 15px -apple-system, system-ui, sans-serif; }
  #palette input { width: 100%; border: 0; outline: 0; padding: 14px 16px; font: inherit; border-bottom: 1px solid #eee; }
  #palette li { list-style: none; padding: 10px 16px; display: flex; justify-content: space-between; }
  #palette li.sel { background: #f0f1fe; }
  #palette ul { margin: 0; padding: 4px 0; }
  kbd { font: 12px -apple-system, system-ui; color: var(--muted); }
</style>
</head>
<body>
<header><b id="title">Untitled</b><span id="wc"></span></header>
<textarea id="editor" spellcheck="false"></textarea>
<div id="palette"><div class="box"><input placeholder="Type a command…"><ul></ul></div></div>
<script>
  const ed = document.getElementById("editor");
  const seed = window.__seed;
  if (seed) { ed.value = seed.text.replace(/^# .*\n+/, ""); document.getElementById("title").textContent = seed.title; }
  const wc = () => { document.getElementById("wc").textContent = (ed.value.trim().match(/\S+/g) || []).length + " words"; };
  ed.addEventListener("input", wc); wc();
  const commands = [
    { name: "Focus mode", key: "⌘.", run: () => document.body.classList.toggle("focus") },
    { name: "Word count", key: "⌘⇧W", run: () => document.body.classList.toggle("wc") },
    { name: "Clear document", key: "", run: () => { ed.value = ""; wc(); } },
  ];
  const pal = document.getElementById("palette"), input = pal.querySelector("input"), list = pal.querySelector("ul");
  const render = () => {
    const q = input.value.toLowerCase();
    list.innerHTML = "";
    commands.filter((c) => c.name.toLowerCase().includes(q)).forEach((c, i) => {
      const li = document.createElement("li"); if (i === 0) li.className = "sel";
      li.innerHTML = `<span>${c.name}</span><kbd>${c.key}</kbd>`; li.onclick = () => { close(); c.run(); }; list.appendChild(li);
    });
  };
  const open = () => { pal.classList.add("open"); input.value = ""; render(); input.focus(); };
  const close = () => { pal.classList.remove("open"); ed.focus(); };
  input.addEventListener("input", render);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape") close();
    if (e.key === "Enter") { const q = input.value.toLowerCase(); const c = commands.find((c) => c.name.toLowerCase().includes(q)); close(); c && c.run(); }
  });
  document.addEventListener("keydown", (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); open(); }
    if (mod && e.key === ".") { e.preventDefault(); document.body.classList.toggle("focus"); }
    if (mod && e.shiftKey && e.key.toLowerCase() === "w") { e.preventDefault(); document.body.classList.toggle("wc"); }
  });
</script>
</body>
</html>
